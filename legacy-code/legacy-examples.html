        /* *** imgcompare - Image slider compare ***
Inspired by https://www.cssscript.com/responsive-image-comparison-slider-vanilla-javascript/
(https://github.com/ArekPastuszka/before-after) by ArekPastuszka
and by https://codepen.io/bamf/pen/jEpxOX by Ege Görgülü.
Maybe I should convert it to use pointerEvents (https://youtu.be/MhUCYR9Tb9c) as an exercise ?
Or maybe I should just take a look at https://github.com/pehaa/beerslider instead?
*/
        .leftright {
            position: relative;
            max-width: fit-content;
            /*display: inline-block;*/ /* inline-block breaks "responsiveness" in IE - And for now I don't really need it?... */
            vertical-align: top;
            user-select: none;
        }
        .leftright img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .leftright .photo.left {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transform: translate(-50%);
        }
        .leftright .photo.left img {
            transform: translate(50%);
        }
        .leftright .draghandler {
            /* Thin line seperator */
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            margin-left: -2px;
            background-color: rgb(0 0 0 / 0.2);
            cursor: ew-resize;
            opacity: 0.5; /* Maybe not on mobile? */
        }
        .leftright:hover .draghandler {
            opacity: 1;
        }
        .leftright .draghandler:after {
            /* Big orange knob  */
            position: absolute;
            top: 50%;
            width: 48px;
            height: 48px;
            margin: -24px 0 0 -24px;

            content: "\21d4";
            color: white;
            font-weight: bold;
            font-size: 32px;
            text-align: center;
            line-height: 43px;

            background-color: #ffb800; /* @orange */
            border: 1px solid #e6a600; /* darken(@orange, 5%) */
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgb(0 0 0 / 0.3), inset 0 2px 0 rgb(255 255 255 / 0.5), inset 0 60px 50px -30px #ffd466; /* lighten(@orange, 20%)*/
        }
        .leftright .dragging:after {
            width: 36px;
            height: 36px;
            margin: -18px 0 0 -18px;
            line-height: 32px;
            font-size: 28px;
        }

    </style>
    <script src="legacy-image-compare.js" type="module"></script>
