<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Examples</title>
    <script src="webcomponent/compare-images.js" type="module"></script>
    <style>
        body {
            padding: 1em 2em 2em 2em;
        }
        compare-images {
            max-width: 100vmin;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let compareElement = document.getElementsByTagName('compare-images')?.item(0);
            document.getElementById('insert')?.addEventListener('click', () => {
                if (document.getElementById('comparing').children.length === 0 && compareElement) {
                    document.getElementById('comparing').appendChild(compareElement);
                }
            });
            document.getElementById('remove')?.addEventListener('click', () => {
                if (document.getElementById('comparing').children.length > 0) {
                    document.getElementById('comparing').removeChild(compareElement);
                }
            });
        })
    </script>
</head>

<body>
<main>
    <h1>Examples</h1>

    <div>
        <button id="insert">Insert</button>
        <button id="remove">Remove</button>
    </div>

    <p>...</p>

    <div id="comparing">
        <compare-images>
            <img src="https://live.staticflickr.com/5752/20853002160_69e86ab616_k.jpg" alt="first image in comparison">
            <img src="https://live.staticflickr.com/6195/6035942305_f4d7aeeb1a_k.jpg" alt="second image in comparison">
        </compare-images>
    </div>

    <p>...</p>

</main>
</body>
</html>
